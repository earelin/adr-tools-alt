name: SBOM Generation

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]
  schedule:
    # Generate weekly SBOM on Sundays at 02:00 UTC (before Snyk Monday scan)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      upload_to_snyk:
        description: 'Upload SBOM to Snyk for scanning'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    
    outputs:
      sbom-path: ${{ steps.sbom-generate.outputs.sbom-path }}
      sbom-cyclonedx-path: ${{ steps.sbom-generate.outputs.sbom-cyclonedx-path }}
      sbom-spdx-path: ${{ steps.sbom-generate.outputs.sbom-spdx-path }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build project (required for accurate dependency resolution)
        run: cargo build --release

      - name: Install cargo-cyclonedx for SBOM generation
        run: cargo install cargo-cyclonedx

      - name: Install syft for additional SBOM formats
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Generate SBOM files
        id: sbom-generate
        run: |
          # Create SBOM directory
          mkdir -p sbom-artifacts
          
          # Generate CycloneDX SBOM (JSON format - preferred for Snyk)
          echo "📦 Generating CycloneDX SBOM..."
          cargo cyclonedx --format json
          
          # Move to standard directory and naming
          if [[ -f "adr-tools-alt.cdx.json" ]]; then
            mv "adr-tools-alt.cdx.json" sbom-artifacts/sbom-cyclonedx.json
          elif [[ -f "*.cdx.json" ]]; then
            mv *.cdx.json sbom-artifacts/sbom-cyclonedx.json
          else
            echo "❌ CycloneDX SBOM file not found"
            ls -la *.json 2>/dev/null || echo "No JSON files found"
            exit 1
          fi
          
          # Generate SPDX SBOM using syft (alternative format)
          echo "📦 Generating SPDX SBOM..."
          syft packages . -o spdx-json=sbom-artifacts/sbom-spdx.json
          
          # Generate human-readable text version for inspection
          echo "📦 Generating human-readable SBOM..."
          syft packages . -o table=sbom-artifacts/sbom-table.txt
          
          # Generate Syft JSON format (comprehensive)
          echo "📦 Generating Syft JSON SBOM..."
          syft packages . -o json=sbom-artifacts/sbom-syft.json
          
          # Set outputs for downstream jobs
          echo "sbom-cyclonedx-path=sbom-artifacts/sbom-cyclonedx.json" >> $GITHUB_OUTPUT
          echo "sbom-spdx-path=sbom-artifacts/sbom-spdx.json" >> $GITHUB_OUTPUT
          echo "sbom-syft-path=sbom-artifacts/sbom-syft.json" >> $GITHUB_OUTPUT

      - name: Validate SBOM files
        run: |
          echo "🔍 Validating generated SBOM files..."
          
          # Check file sizes and content
          for file in sbom-artifacts/*.json; do
            if [[ -f "$file" ]]; then
              size=$(wc -c < "$file")
              echo "✅ $file: ${size} bytes"
              
              # Basic JSON validation
              if jq empty "$file" 2>/dev/null; then
                echo "  ✅ Valid JSON format"
              else
                echo "  ❌ Invalid JSON format"
                exit 1
              fi
              
              # Check if contains components/packages
              if jq -e '.components // .packages // .artifacts' "$file" > /dev/null 2>&1; then
                count=$(jq -r '(.components // .packages // .artifacts) | length' "$file")
                echo "  ✅ Contains ${count} components/packages"
              else
                echo "  ⚠️ No components/packages found"
              fi
            else
              echo "❌ $file not found"
              exit 1
            fi
          done

      - name: Generate SBOM summary
        run: |
          echo "## SBOM Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Format | File | Size | Components |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|------|------------|" >> $GITHUB_STEP_SUMMARY
          
          for file in sbom-artifacts/*.json; do
            if [[ -f "$file" ]]; then
              name=$(basename "$file")
              size=$(wc -c < "$file" | numfmt --to=iec)
              count=$(jq -r '(.components // .packages // .artifacts) | length' "$file" 2>/dev/null || echo "N/A")
              format=$(echo "$name" | cut -d'-' -f2 | cut -d'.' -f1)
              echo "| $format | $name | $size | $count |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Key Dependencies Found:" >> $GITHUB_STEP_SUMMARY
          
          # Extract and show key dependencies from CycloneDX
          if [[ -f "sbom-artifacts/sbom-cyclonedx.json" ]]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            jq -r '.components[] | select(.type == "library") | "\(.name) \(.version)"' sbom-artifacts/sbom-cyclonedx.json | head -10 >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-artifacts/
          retention-days: 30

      - name: Upload to release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sbom-artifacts/sbom-cyclonedx.json
            sbom-artifacts/sbom-spdx.json
            sbom-artifacts/sbom-table.txt

  snyk-sbom-scan:
    name: Snyk SBOM Scan
    runs-on: ubuntu-latest
    needs: generate-sbom
    if: (github.event.inputs.upload_to_snyk != 'false') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/trunk')
    
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-artifacts/

      - name: Check Snyk token availability
        id: check-token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "❌ SNYK_TOKEN not set - skipping SBOM scan"
            echo "token_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ SNYK_TOKEN available - proceeding with SBOM scan"
            echo "token_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Snyk CLI
        if: steps.check-token.outputs.token_available == 'true'
        uses: snyk/actions/setup@master

      - name: Test SBOM with Snyk
        if: steps.check-token.outputs.token_available == 'true'
        run: |
          echo "🔍 Scanning SBOM with Snyk..."
          
          # Scan CycloneDX SBOM (preferred format)
          if [[ -f "sbom-artifacts/sbom-cyclonedx.json" ]]; then
            echo "📊 Scanning CycloneDX SBOM..."
            snyk test --file=sbom-artifacts/sbom-cyclonedx.json \
              --package-manager=cyclonedx \
              --severity-threshold=medium \
              --project-name="adr-tools-alt-sbom-cyclonedx" || {
              echo "⚠️ CycloneDX SBOM scan found issues"
              echo "This doesn't fail the build - check Snyk dashboard for details"
            }
          fi
          
          # Scan SPDX SBOM (fallback)
          if [[ -f "sbom-artifacts/sbom-spdx.json" ]]; then
            echo "📊 Scanning SPDX SBOM..."
            snyk test --file=sbom-artifacts/sbom-spdx.json \
              --package-manager=spdx \
              --severity-threshold=medium \
              --project-name="adr-tools-alt-sbom-spdx" || {
              echo "⚠️ SPDX SBOM scan found issues"
              echo "This doesn't fail the build - check Snyk dashboard for details"
            }
          fi
        continue-on-error: true

      - name: Monitor SBOM in Snyk (trunk only)
        if: steps.check-token.outputs.token_available == 'true' && github.ref == 'refs/heads/trunk'
        run: |
          echo "📊 Adding SBOM to Snyk monitoring..."
          
          if [[ -f "sbom-artifacts/sbom-cyclonedx.json" ]]; then
            snyk monitor --file=sbom-artifacts/sbom-cyclonedx.json \
              --package-manager=cyclonedx \
              --project-name="adr-tools-alt-sbom" \
              --target-reference="${GITHUB_REF}" || {
              echo "⚠️ SBOM monitor failed (this is usually not critical)"
            }
          fi
        continue-on-error: true

      - name: Generate SBOM scan summary
        if: always()
        run: |
          echo "## SBOM Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-token.outputs.token_available }}" == "true" ]; then
            echo "✅ SBOM security scan completed" >> $GITHUB_STEP_SUMMARY
            echo "📊 Check [Snyk dashboard](https://app.snyk.io) for detailed vulnerability analysis" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Scanned Files:" >> $GITHUB_STEP_SUMMARY
            echo "- CycloneDX SBOM (JSON)" >> $GITHUB_STEP_SUMMARY
            echo "- SPDX SBOM (JSON)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ SBOM scan skipped - no Snyk token available" >> $GITHUB_STEP_SUMMARY
            echo "💡 Add SNYK_TOKEN to repository secrets to enable SBOM security scanning" >> $GITHUB_STEP_SUMMARY
          fi

  validate-sbom-quality:
    name: SBOM Quality Validation
    runs-on: ubuntu-latest
    needs: generate-sbom
    
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-artifacts/

      - name: Install SBOM validation tools
        run: |
          # Install SBOM quality checker (if available)
          pip install cyclonedx-bom
          
      - name: Validate SBOM completeness
        run: |
          echo "🔍 Validating SBOM quality and completeness..."
          
          # Check for required fields in CycloneDX
          if [[ -f "sbom-artifacts/sbom-cyclonedx.json" ]]; then
            echo "📊 Analyzing CycloneDX SBOM..."
            
            # Check metadata completeness
            if jq -e '.metadata' sbom-artifacts/sbom-cyclonedx.json > /dev/null; then
              echo "✅ Metadata present"
            else
              echo "⚠️ Missing metadata section"
            fi
            
            # Check component licenses
            licensed_components=$(jq -r '.components[] | select(.licenses) | .name' sbom-artifacts/sbom-cyclonedx.json | wc -l)
            total_components=$(jq -r '.components | length' sbom-artifacts/sbom-cyclonedx.json)
            
            echo "📄 License coverage: $licensed_components/$total_components components"
            
            # Check for security-relevant components
            crypto_components=$(jq -r '.components[] | select(.name | test("crypto|ssl|tls|security"; "i")) | .name' sbom-artifacts/sbom-cyclonedx.json | wc -l)
            echo "🔒 Security-related components: $crypto_components"
          fi
          
          echo "✅ SBOM quality validation completed"

      - name: SBOM Quality Report
        run: |
          echo "## SBOM Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f "sbom-artifacts/sbom-cyclonedx.json" ]]; then
            total_components=$(jq -r '.components | length' sbom-artifacts/sbom-cyclonedx.json)
            licensed_components=$(jq -r '.components[] | select(.licenses) | .name' sbom-artifacts/sbom-cyclonedx.json | wc -l)
            crypto_components=$(jq -r '.components[] | select(.name | test("crypto|ssl|tls|security"; "i")) | .name' sbom-artifacts/sbom-cyclonedx.json | wc -l)
            
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Components | $total_components |" >> $GITHUB_STEP_SUMMARY
            echo "| Licensed Components | $licensed_components |" >> $GITHUB_STEP_SUMMARY
            echo "| License Coverage | $(( licensed_components * 100 / total_components ))% |" >> $GITHUB_STEP_SUMMARY
            echo "| Security Components | $crypto_components |" >> $GITHUB_STEP_SUMMARY
          fi