name: Snyk Security

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]
  schedule:
    # Run weekly on Mondays at 08:00 UTC (after SBOM generation on Sunday)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      include_sbom_scan:
        description: 'Include SBOM-based scanning'
        required: false
        default: 'true'
        type: boolean

jobs:
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Snyk token availability
        id: check-token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "❌ SNYK_TOKEN not set - skipping security scan"
            echo "token_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ SNYK_TOKEN available - proceeding with scan"
            echo "token_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust toolchain
        if: steps.check-token.outputs.token_available == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        if: steps.check-token.outputs.token_available == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build project
        if: steps.check-token.outputs.token_available == 'true'
        run: cargo build

      - name: Setup Snyk CLI
        if: steps.check-token.outputs.token_available == 'true'
        uses: snyk/actions/setup@master
        continue-on-error: true

      - name: Run Snyk Open Source scan
        if: steps.check-token.outputs.token_available == 'true'
        run: |
          echo "🔍 Running Snyk dependency scan..."
          snyk test --all-projects \
            --severity-threshold=medium \
            --target-reference="${GITHUB_REF}" \
            --sarif-file-output=snyk-oss.sarif || {
            echo "⚠️ Snyk scan found issues or failed"
            exit 0
          }
        continue-on-error: true

      - name: Run Snyk Code Analysis
        if: steps.check-token.outputs.token_available == 'true'
        run: |
          echo "🔍 Running Snyk code analysis..."
          snyk code test \
            --severity-threshold=medium \
            --sarif-file-output=snyk-code.sarif || {
            echo "⚠️ Snyk code analysis found issues or failed"
            exit 0
          }
        continue-on-error: true

      - name: Generate quick SBOM for scanning
        if: steps.check-token.outputs.token_available == 'true' && (github.event.inputs.include_sbom_scan != 'false')
        run: |
          echo "📦 Generating SBOM for Snyk scanning..."
          
          # Install cargo-cyclonedx if not available
          if ! command -v cargo-cyclonedx &> /dev/null; then
            cargo install cargo-cyclonedx
          fi
          
          # Generate CycloneDX SBOM
          cargo cyclonedx --format json
          
          # Find and rename the generated file
          if [[ -f "adr-tools-alt.cdx.json" ]]; then
            mv "adr-tools-alt.cdx.json" snyk-sbom.json
          elif ls *.cdx.json 1> /dev/null 2>&1; then
            mv *.cdx.json snyk-sbom.json
          else
            echo "⚠️ CycloneDX SBOM file not found, attempting syft fallback"
            # Install syft as fallback
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /tmp/syft-bin
            export PATH="/tmp/syft-bin:$PATH"
            if command -v syft &> /dev/null; then
              syft packages . -o cyclonedx-json=snyk-sbom.json
            else
              echo "❌ No SBOM generation tools available"
              exit 1
            fi
          fi
          
          # Verify SBOM was created
          if [[ ! -f "snyk-sbom.json" ]]; then
            echo "❌ Failed to generate SBOM file"
            exit 1
          else
            echo "✅ SBOM generated successfully ($(wc -c < snyk-sbom.json) bytes)"
          fi
        continue-on-error: true

      - name: Scan SBOM with Snyk
        if: steps.check-token.outputs.token_available == 'true' && (github.event.inputs.include_sbom_scan != 'false')
        run: |
          if [[ -f "snyk-sbom.json" ]]; then
            echo "🔍 Scanning SBOM with Snyk..."
           snyk sbom test --experimental --file=snyk-sbom.json \
              --package-manager=cyclonedx \
              --severity-threshold=medium \
              --sarif-file-output=snyk-sbom.sarif || {
              echo "⚠️ SBOM scan found issues"
              exit 0
            }
          else
            echo "⚠️ SBOM file not found, skipping SBOM scan"
          fi
        continue-on-error: true

      - name: Upload Snyk SARIF reports
        if: steps.check-token.outputs.token_available == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: |
            snyk-oss.sarif
            snyk-code.sarif
            snyk-sbom.sarif
        continue-on-error: true

      - name: Monitor project in Snyk (trunk only)
        if: steps.check-token.outputs.token_available == 'true' && github.ref == 'refs/heads/trunk'
        run: |
          echo "📊 Adding project to Snyk monitoring..."
          snyk monitor --all-projects || {
            echo "⚠️ Snyk monitor failed (this is usually not critical)"
            exit 0
          }
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check-token.outputs.token_available }}" == "true" ]; then
            echo "✅ Snyk security scan completed"
            echo "📊 Check Snyk dashboard for detailed results"
            echo "🔍 SARIF reports uploaded to GitHub Security tab"
            if [[ -f "snyk-sbom.json" ]]; then
              echo "📦 SBOM scan included"
            fi
          else
            echo "ℹ️ Snyk scan skipped - no token available"
            echo "💡 Add SNYK_TOKEN to repository secrets to enable security scanning"
          fi

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f snyk-sbom.json *.sarif