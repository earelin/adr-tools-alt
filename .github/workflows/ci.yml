name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run tests
        run: cargo test --all-features --workspace -- --test-threads=1

      - name: Run integration tests
        run: |
          cargo build --release
          # Test basic functionality in clean directory
          cd $(mktemp -d)
          $GITHUB_WORKSPACE/target/release/adr-tools-alt init
          $GITHUB_WORKSPACE/target/release/adr-tools-alt new "Test ADR"
          $GITHUB_WORKSPACE/target/release/adr-tools-alt list
          $GITHUB_WORKSPACE/target/release/adr-tools-alt generate toc

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Check if Snyk token is available
        id: snyk-check
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "snyk_available=true" >> $GITHUB_OUTPUT
          else
            echo "snyk_available=false" >> $GITHUB_OUTPUT
            echo "ℹ️ SNYK_TOKEN not available, skipping quick Snyk scan"
          fi
        
      - name: Setup Snyk (if available)
        if: steps.snyk-check.outputs.snyk_available == 'true'
        uses: snyk/actions/setup@master
        
      - name: Quick Snyk scan
        if: steps.snyk-check.outputs.snyk_available == 'true'
        run: |
          snyk test --severity-threshold=high
        continue-on-error: true

  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: adr-tools-alt.exe
            asset_name: adr-tools-alt-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test binary functionality (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --help

      - name: Test binary functionality (Windows)
        if: runner.os == 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.70 (MSRV)
        uses: dtolnay/rust-toolchain@1.70.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check MSRV compatibility
        run: cargo check --all-features

  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Test release workflow
        run: cargo release --dry-run --allow-branch=*