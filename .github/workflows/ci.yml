name: CI (Pull Request)

on:
  pull_request:
    branches: [ trunk ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run tests
        run: cargo test --all-features --workspace -- --test-threads=1

      - name: Run integration tests
        run: |
          cargo build --release
          # Test basic functionality in clean directory
          cd $(mktemp -d)
          $GITHUB_WORKSPACE/target/release/adr-tools-alt init
          $GITHUB_WORKSPACE/target/release/adr-tools-alt new "Test ADR"
          $GITHUB_WORKSPACE/target/release/adr-tools-alt list
          $GITHUB_WORKSPACE/target/release/adr-tools-alt generate toc

  build:
    name: Build Matrix
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: adr-tools-alt.exe
            asset_name: adr-tools-alt-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test binary functionality (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --help

      - name: Test binary functionality (Windows)
        if: runner.os == 'Windows'
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.70 (MSRV)
        uses: dtolnay/rust-toolchain@1.70.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check MSRV compatibility
        run: cargo check --all-features

  validate-workflows:
    name: Workflow Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflows
        run: |
          # Basic YAML validation
          for file in .github/workflows/*.yml; do
            if [[ -f "$file" ]]; then
              echo "Checking $file..."
              if command -v python3 >/dev/null 2>&1; then
                python3 -c "import yaml; yaml.safe_load(open('$file', 'r'))" || {
                  echo "❌ YAML validation failed for $file"
                  exit 1
                }
              fi
            fi
          done
          echo "✅ All workflow files are valid"

  pr-summary:
    name: PR Summary
    needs: [check, test, build, coverage, msrv, validate-workflows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: PR Check Summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check job results
          check_result="${{ needs.check.result }}"
          test_result="${{ needs.test.result }}"
          build_result="${{ needs.build.result }}"
          coverage_result="${{ needs.coverage.result }}"
          msrv_result="${{ needs.msrv.result }}"
          validate_result="${{ needs.validate-workflows.result }}"
          
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | $([[ "$check_result" == "success" ]] && echo "✅ Passed" || echo "❌ Failed") |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | $([[ "$test_result" == "success" ]] && echo "✅ Passed" || echo "❌ Failed") |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Matrix | $([[ "$build_result" == "success" ]] && echo "✅ Passed" || echo "❌ Failed") |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Coverage | $([[ "$coverage_result" == "success" ]] && echo "✅ Passed" || echo "❌ Failed") |" >> $GITHUB_STEP_SUMMARY
          echo "| MSRV Check | $([[ "$msrv_result" == "success" ]] && echo "✅ Passed" || echo "❌ Failed") |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Validation | $([[ "$validate_result" == "success" ]] && echo "✅ Passed" || echo "❌ Failed") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [[ "$check_result" == "success" && "$test_result" == "success" && "$build_result" == "success" && "$msrv_result" == "success" ]]; then
            echo "🎉 **All CI checks passed!** This PR is ready for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some CI checks failed.** Please review and fix the issues above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi