name: Snyk Security (Simple)

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]
  schedule:
    # Run weekly on Mondays at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    # Only run if SNYK_TOKEN is available
    if: ${{ github.event_name == 'schedule' || github.repository_owner != 'github' }}
    
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Snyk token availability
        id: check-token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "❌ SNYK_TOKEN not set - skipping security scan"
            echo "token_available=false" >> $GITHUB_OUTPUT
          else
            echo "✅ SNYK_TOKEN available - proceeding with scan"
            echo "token_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust toolchain
        if: steps.check-token.outputs.token_available == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        if: steps.check-token.outputs.token_available == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build project
        if: steps.check-token.outputs.token_available == 'true'
        run: cargo build

      - name: Setup Snyk CLI
        if: steps.check-token.outputs.token_available == 'true'
        uses: snyk/actions/setup@master
        continue-on-error: true

      - name: Run Snyk Open Source scan
        if: steps.check-token.outputs.token_available == 'true'
        run: |
          echo "🔍 Running Snyk dependency scan..."
          snyk test --all-projects \
            --severity-threshold=medium \
            --project-name=adr-tools-alt \
            --target-reference="${GITHUB_REF}" || {
            echo "⚠️ Snyk scan found issues or failed"
            exit 0
          }
        continue-on-error: true

      - name: Run Snyk Code Analysis
        if: steps.check-token.outputs.token_available == 'true'
        run: |
          echo "🔍 Running Snyk code analysis..."
          snyk code test \
            --severity-threshold=medium || {
            echo "⚠️ Snyk code analysis found issues or failed"
            exit 0
          }
        continue-on-error: true

      - name: Monitor project in Snyk (trunk only)
        if: steps.check-token.outputs.token_available == 'true' && github.ref == 'refs/heads/trunk'
        run: |
          echo "📊 Adding project to Snyk monitoring..."
          snyk monitor --project-name=adr-tools-alt || {
            echo "⚠️ Snyk monitor failed (this is usually not critical)"
            exit 0
          }
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check-token.outputs.token_available }}" == "true" ]; then
            echo "✅ Snyk security scan completed"
            echo "📊 Check Snyk dashboard for detailed results"
          else
            echo "ℹ️ Snyk scan skipped - no token available"
            echo "💡 Add SNYK_TOKEN to repository secrets to enable security scanning"
          fi