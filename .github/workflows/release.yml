name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-build-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Release
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-linux-x86_64
            use_cross: false

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-linux-x86_64-musl
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-linux-aarch64
            use_cross: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: adr-tools-alt.exe
            asset_name: adr-tools-alt-windows-x86_64.exe
            use_cross: false

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-macos-x86_64
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-macos-aarch64
            use_cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install platform dependencies (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            echo "🔧 Building with cross for ${{ matrix.target }}"
            cross build --release --target ${{ matrix.target }}
          else
            echo "🔧 Building natively for ${{ matrix.target }}"
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare and verify binary
        shell: bash
        run: |
          binary_path="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          
          # Verify binary exists
          if [[ ! -f "$binary_path" ]]; then
            echo "❌ Binary not found at: $binary_path"
            ls -la target/${{ matrix.target }}/release/
            exit 1
          fi
          
          echo "✅ Binary found: $binary_path"
          
          # Create staging directory
          mkdir -p staging
          
          # Copy binary to staging with final asset name
          cp "$binary_path" "staging/${{ matrix.asset_name }}"
          
          # Set executable permissions (Unix only)
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "staging/${{ matrix.asset_name }}"
          fi
          
          # Show binary info
          echo "📋 Binary information:"
          ls -lh "staging/${{ matrix.asset_name }}"
          
          # Test binary execution (basic version check)
          echo "🧪 Testing binary execution:"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            "./staging/${{ matrix.asset_name }}" --version
          else
            ./staging/${{ matrix.asset_name }} --version
          fi

      - name: Prepare asset for upload
        run: |
          echo "📋 Upload preparation:"
          echo "  Asset name: ${{ matrix.asset_name }}"
          echo "  Asset path: staging/${{ matrix.asset_name }}"
          echo "  File exists: $(test -f "staging/${{ matrix.asset_name }}" && echo "✅ Yes" || echo "❌ No")"
          if [[ -f "staging/${{ matrix.asset_name }}" ]]; then
            echo "  File size: $(ls -lh staging/${{ matrix.asset_name }} | awk '{print $5}')"
            echo "  File permissions: $(ls -l staging/${{ matrix.asset_name }} | awk '{print $1}')"
          fi
          echo "  Release tag: ${{ github.event.release.tag_name }}"
          echo "  Upload URL: ${{ github.event.release.upload_url }}"

      - name: Upload Release Asset
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: staging/${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: staging/${{ matrix.asset_name }}
          retention-days: 7

  release-summary:
    name: Release Summary
    needs: build-release
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Release Summary
        run: |
          echo "## Release Build Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check build results
          build_result="${{ needs.build-release.result }}"
          
          if [[ "$build_result" == "success" ]]; then
            echo "### ✅ Build Status: Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All platform binaries were built and attached to the release:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Platform | Architecture | Binary |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|--------------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Linux | x86_64 | \`adr-tools-alt-linux-x86_64\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Linux | x86_64 (musl) | \`adr-tools-alt-linux-x86_64-musl\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Linux | aarch64 | \`adr-tools-alt-linux-aarch64\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Windows | x86_64 | \`adr-tools-alt-windows-x86_64.exe\` |" >> $GITHUB_STEP_SUMMARY
            echo "| macOS | x86_64 | \`adr-tools-alt-macos-x86_64\` |" >> $GITHUB_STEP_SUMMARY
            echo "| macOS | aarch64 (Apple Silicon) | \`adr-tools-alt-macos-aarch64\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
            echo "- [📦 Release Page](${{ github.event.release.html_url }})" >> $GITHUB_STEP_SUMMARY
            echo "- [⬇️ Download Assets](${{ github.event.release.html_url }})" >> $GITHUB_STEP_SUMMARY
            echo "- [📚 Installation Guide](https://github.com/${{ github.repository }}#installation)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🛡️ Security Notes" >> $GITHUB_STEP_SUMMARY
            echo "- All binaries built from tagged source: \`${{ github.event.release.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Build environment: GitHub Actions with audit trail" >> $GITHUB_STEP_SUMMARY
            echo "- Binaries tested for basic functionality during build" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Status: Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some builds failed. Please check the job logs above for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Post-release notification
        if: needs.build-release.result == 'success'
        run: |
          echo "🎉 Release ${{ github.event.release.tag_name }} is ready!"
          echo "📦 Binaries attached to: ${{ github.event.release.html_url }}"
          echo "🔗 All platforms supported: Linux (x86_64, aarch64), Windows (x86_64), macOS (x86_64, Apple Silicon)"