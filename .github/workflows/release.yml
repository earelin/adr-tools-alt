name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-release validation
  pre-release-validation:
    name: Pre-release Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Validate version consistency
        run: |
          tag_version="${{ steps.get_version.outputs.version }}"
          cargo_version=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "❌ Version mismatch: tag=$tag_version, Cargo.toml=$cargo_version"
            exit 1
          else
            echo "✅ Version consistency validated: $tag_version"
          fi

      - name: Run release checks
        run: |
          # Quick validation that project is in good state
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features --workspace -- --test-threads=1

  # Generate SBOM for release
  generate-release-sbom:
    name: Generate Release SBOM
    runs-on: ubuntu-latest
    needs: pre-release-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release for SBOM
        run: cargo build --release

      - name: Install SBOM tools
        run: |
          cargo install cargo-cyclonedx
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate release SBOM
        run: |
          mkdir -p release-sbom
          
          # Generate CycloneDX SBOM
          cargo cyclonedx --format json
          if [[ -f "adr-tools-alt.cdx.json" ]]; then
            mv "adr-tools-alt.cdx.json" "release-sbom/adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-sbom.json"
          fi
          
          # Generate SPDX SBOM
          syft packages . -o spdx-json="release-sbom/adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-spdx.json" -q
          
          # Generate human-readable SBOM
          syft packages . -o table="release-sbom/adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-sbom.txt" -q

      - name: Upload release SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: release-sbom/
          retention-days: 90

  # Create GitHub release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [pre-release-validation, generate-release-sbom]
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release SBOM
        uses: actions/download-artifact@v4
        with:
          name: release-sbom
          path: release-sbom/

      - name: Create Release
        id: release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release v${{ needs.pre-release-validation.outputs.version }}
          body: |
            ## adr-tools-alt v${{ needs.pre-release-validation.outputs.version }}
            
            Architecture Decision Records (ADR) management tool written in Rust.
            
            ### What's Changed
            See [CHANGELOG.md](https://github.com/earelin/adr-tools-alt/blob/trunk/CHANGELOG.md) for detailed changes.
            
            ### Installation
            
            #### Option 1: Download Binary
            Download the appropriate binary for your platform from the assets below.
            
            #### Option 2: Install via Cargo
            ```bash
            cargo install adr-tools-alt
            ```
            
            #### Option 3: Build from Source
            ```bash
            git clone https://github.com/earelin/adr-tools-alt.git
            cd adr-tools-alt
            cargo build --release
            ```
            
            ### Usage
            ```bash
            # Initialize ADR directory
            adr-tools-alt init
            
            # Create new ADR
            adr-tools-alt new "Use microservices architecture"
            
            # List all ADRs
            adr-tools-alt list
            
            # Generate table of contents
            adr-tools-alt generate toc
            ```
            
            ### Security
            - 🔒 All binaries are built in GitHub Actions with full audit trails
            - 📦 SBOM (Software Bill of Materials) files included with release
            - 🛡️ Comprehensive security scanning performed
            
            ### Verification
            The release includes SBOM files for supply chain verification:
            - `adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-sbom.json` (CycloneDX format)
            - `adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-spdx.json` (SPDX format)
            - `adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-sbom.txt` (Human-readable)
          draft: false
          prerelease: false

      - name: Upload SBOM Files to Release
        run: |
          for file in release-sbom/*; do
            if [[ -f "$file" ]]; then
              filename=$(basename "$file")
              curl -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$file" \
                "${{ steps.release.outputs.upload_url }}?name=$filename"
            fi
          done

  # Build release binaries
  build-release:
    name: Build Release Binaries
    needs: [create-release, pre-release-validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-linux-x86_64-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: adr-tools-alt.exe
            asset_name: adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: adr-tools-alt
            asset_name: adr-tools-alt-v${{ needs.pre-release-validation.outputs.version }}-macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          binary_path="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          
          # Verify binary exists and works
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$binary_path"
            "$binary_path" --version
          else
            "$binary_path" --version
          fi
          
          # Copy to staging area with final name
          mkdir -p staging
          cp "$binary_path" "staging/${{ matrix.asset_name }}"

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: staging/${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream

  # Post-release tasks
  post-release:
    name: Post-release Tasks
    needs: [create-release, build-release, pre-release-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post-release summary
        run: |
          echo "## Release v${{ needs.pre-release-validation.outputs.version }} Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ What was released:" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Cross-platform binaries (Linux, Windows, macOS)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 SBOM files for supply chain verification" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 Full security validation performed" >> $GITHUB_STEP_SUMMARY
          echo "- 📚 Complete documentation included" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Page](https://github.com/earelin/adr-tools-alt/releases/tag/v${{ needs.pre-release-validation.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Installation Guide](https://github.com/earelin/adr-tools-alt#installation)" >> $GITHUB_STEP_SUMMARY
          echo "- [Documentation](https://docs.rs/adr-tools-alt)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Update package registries (if applicable)" >> $GITHUB_STEP_SUMMARY
          echo "2. Announce the release" >> $GITHUB_STEP_SUMMARY
          echo "3. Update documentation sites" >> $GITHUB_STEP_SUMMARY

      - name: Trigger follow-up workflows
        run: |
          echo "🔄 Consider triggering follow-up workflows:"
          echo "  - Package registry updates"
          echo "  - Documentation deployment"
          echo "  - Announcement automation"