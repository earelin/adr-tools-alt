[package]
name = "adr-tools-alt"
version = "0.1.0"
edition = "2021"
description = "Alternative tools for managing Architecture Decision Records (ADRs) written in Rust"
authors = ["Xavier <xavier@example.com>"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/earelin/adr-tools-alt"
keywords = ["adr", "architecture", "decision", "records", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
regex = "1.0"
